[project]
name = "ecohack-graphs"
version = "0.1.0"
description = "Ready-to-query TuringDB graphs for the EcoHack 2026 AI track"
requires-python = ">=3.10"
dependencies = [
    "turingdb==3.1",
    "pandas>=2.0",
]

[dependency-groups]
build = ["pyproj>=3.6", "geopandas>=1.0", "pyogrio>=0.9", "shapely>=2.0", "networkx>=3.0"]

[tool.uv]
package = false
